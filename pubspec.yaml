name: kartoniya
description: کارتونیا؛ فضای امن و شاد تماشای انیمیشن برای کودکان و والدین.
publish_to: 'none'
version: 1.3.0+5

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Keep direct dependencies on versions verified with Flutter 3.19 / Dart 3.3.
  # Without a lockfile, caret ranges can silently select plugins that require a
  # newer Android SDK or Flutter version and break an otherwise unchanged build.
  flutter_riverpod: 2.6.1
  shared_preferences: 2.2.3
  shimmer: 3.0.0
  url_launcher: 6.3.1
  video_player: 2.8.6
  webview_flutter: 4.7.0
  wakelock_plus: 1.2.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 3.0.2

flutter:
  uses-material-design: true
  assets:
    - asset/images/
    - asset/images/posters/
    # فندوقی: لایه‌های ریگ‌شدهٔ شخصیت (بدن، دست‌ها، پاها، برگ و حالت چشم/دهان)
    - asset/images/fandaq/
  # Vazirmatn (OFL 1.1, see asset/fonts/LICENSE-Vazirmatn.txt) is bundled so the
  # first run works fully offline, cold start avoids a font fetch from the
  # network and the rendering never falls back to a non-Persian fallback font.
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: asset/fonts/Vazirmatn-Regular.ttf
          weight: 400
        - asset: asset/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: asset/fonts/Vazirmatn-Bold.ttf
          weight: 700
        - asset: asset/fonts/Vazirmatn-Black.ttf
          weight: 900
