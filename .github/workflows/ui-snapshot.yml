name: UI Snapshots

# ابزار دستی کنترل کیفیت بصری: صفحه‌ها را با فونت و assetهای واقعی داخل
# Flutter test رندر می‌کند و PNGها را در docs/screenshots ذخیره می‌کند.
# این خروجی «اسکرین‌شات دستگاه واقعی» نیست؛ یک رندر ویجتی قابل‌بازبینی است.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ui-snapshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snapshots:
    name: رندر اسکرین‌شات‌های UI
    if: github.ref == 'refs/heads/arena/f29eaa28-kartoniya'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: stable
          cache: true
      - name: pub get
        run: flutter pub get
      - name: رندر صفحه‌ها
        env:
          KARTONIYA_SCREENSHOTS: '1'
        run: flutter test test/screenshot_test.dart --reporter expanded
      - name: آماده‌سازی خروجی سبک
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          mkdir -p docs/screenshots
          for file in build/screenshots/*.png; do
            convert "$file" -resize 640x -strip -quality 88 \
              "docs/screenshots/$(basename "$file")"
          done
          cat > docs/screenshots/README.md <<'EOF'
          # اسکرین‌شات‌های رندر‌شده در CI

          این تصاویر با `flutter test test/screenshot_test.dart` و فونت
          Vazirmatn و assetهای واقعی پروژه در GitHub Actions رندر شده‌اند.
          آن‌ها برای بازبینی طراحی و چیدمان‌اند و **اسکرین‌شات گوشی واقعی
          نیستند**؛ آزمون دستگاه همچنان لازم است. نام فایل‌ها ترتیب جریان
          Splash → Onboarding → Home → Categories → Search → Detail را
          نشان می‌دهد.
          EOF
      - name: ثبت تغییرات تصویری
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo 'No screenshot changes.'
            exit 0
          fi
          git config user.name 'Kartoniya UI Snapshots'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/screenshots
          git commit -m 'docs: refresh CI-rendered UI snapshots'
          git push
