name: Flutter validation

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "docs/**"
      - "*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"

concurrency:
  group: flutter-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  validate:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.19.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      # Temporary diagnostics: publish the formatter's exact patch as a check
      # output so it can be applied when the local sandbox has no Dart SDK.
      - name: Capture formatter patch
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dart format lib test
          python3 - <<'PYTHON'
          import json, os, subprocess
          repo = os.environ['GITHUB_REPOSITORY']
          sha = os.environ['GITHUB_SHA']
          diff = subprocess.run(
              ['git', 'diff', '--', 'lib', 'test'],
              check=True, capture_output=True, text=True,
          ).stdout
          if not diff:
              diff = 'No formatter changes were produced.'
          chunks = [diff[i:i + 50000] for i in range(0, len(diff), 50000)]
          for index, chunk in enumerate(chunks, 1):
              payload = {
                  'name': f'Dart formatter patch {index}/{len(chunks)}',
                  'head_sha': sha,
                  'status': 'completed',
                  'conclusion': 'neutral',
                  'output': {
                      'title': 'Dart formatter output',
                      'summary': 'Temporary formatter diagnostics for this commit.',
                      'text': '```diff\n' + chunk + '\n```',
                  },
              }
              subprocess.run(
                  ['gh', 'api', '--method', 'POST',
                   f'repos/{repo}/check-runs', '--input', '-'],
                  input=json.dumps(payload), text=True, check=True,
              )
          PYTHON

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --reporter expanded

      - name: Build release APK (pull requests)
        if: github.event_name == 'pull_request'
        run: flutter build apk --release
