name: Flutter validation

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "docs/**"
      - "*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"

concurrency:
  group: flutter-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  validate:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.19.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Capture analyzer diagnostics
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          flutter analyze --no-pub > /tmp/flutter-analyze.log 2>&1
          status=$?
          set -e
          echo "flutter analyze exited with ${status}; publishing diagnostics."
          python3 - <<'PYTHON'
          import json, os, pathlib, subprocess
          repo = os.environ['GITHUB_REPOSITORY']
          sha = os.environ['GITHUB_SHA']
          log = pathlib.Path('/tmp/flutter-analyze.log').read_text(errors='replace')
          payload = {
              'name': 'Flutter analyzer diagnostics',
              'head_sha': sha,
              'status': 'completed',
              'conclusion': 'neutral',
              'output': {
                  'title': 'flutter analyze output',
                  'summary': 'Temporary analysis diagnostics for this commit.',
                  'text': '```text\n' + log[-60000:] + '\n```',
              },
          }
          subprocess.run(
              ['gh', 'api', '--method', 'POST',
               f'repos/{repo}/check-runs', '--input', '-'],
              input=json.dumps(payload), text=True, check=True,
          )
          PYTHON

      - name: Test
        run: flutter test --reporter expanded

      - name: Build release APK (pull requests)
        if: github.event_name == 'pull_request'
        run: flutter build apk --release
