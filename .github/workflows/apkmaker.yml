name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'نوع بیلد APK'
        type: choice
        required: true
        default: 'release'
        options:
          - release
          - debug
          - both
  push:
    tags:
      - 'v*'

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: بیلد APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
      artifacts: write

    steps:
      - name: دریافت کدها (Checkout)
        uses: actions/checkout@v4

      - name: راه‌اندازی جاوا (Java 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: راه‌اندازی فلاتر
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: stable
          cache: true

      - name: نصب پکیج‌ها (pub get)
        run: flutter pub get

      # تست‌ها غیرمسدودکننده‌اند؛ برای اجباری‌کردن، continue-on-error را حذف کنید
      - name: تست‌ها (غیرمسدودکننده)
        continue-on-error: true
        run: flutter test --reporter expanded

      - name: بیلد release APK (تفکیک ABI)
        if: ${{ github.event_name == 'push' || github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both' }}
        run: flutter build apk --release --split-per-abi

      - name: بیلد debug APK
        if: ${{ github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'both' }}
        run: flutter build apk --debug

      - name: انتشار release APKها (Artifact)
        if: ${{ github.event_name == 'push' || github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: kartoniya-release-apks
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: انتشار debug APK (Artifact)
        if: ${{ github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: kartoniya-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30
