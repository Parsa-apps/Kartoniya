name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      api_delivery:
        description: 'Export APK through GitHub API for restricted clients (no Git history changes)'
        type: boolean
        default: false
      build_type:
        description: 'نوع بیلد APK'
        type: choice
        required: true
        default: 'release'
        options:
          - release
          - debug
          - both
  push:
    branches: ["**"]
    tags: ["v*"]
    paths-ignore:
      - "docs/**"
      - "*.md"

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: بیلد APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    permissions:
      contents: write
      actions: write
      checks: write

    steps:
      - name: دریافت کدها (Checkout)
        uses: actions/checkout@v4

      - name: راه‌اندازی جاوا (Java 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: راه‌اندازی فلاتر
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: stable
          cache: true

      - name: نصب پکیج‌ها (pub get)
        run: flutter pub get

      - name: بررسی قالب‌بندی Dart (غیربازدارنده)
        run: |
          set +e
          dart format --output=none --set-exit-if-changed lib test 2>&1 | tee /tmp/flutter-format.log
          format_status=${PIPESTATUS[0]}
          if [[ $format_status -ne 0 ]]; then
            echo 'Existing Dart files need formatting; analysis, tests, and APK build will still run.' | tee -a /tmp/flutter-format.log
          fi

      - name: تحلیل Flutter
        run: flutter analyze --no-pub 2>&1 | tee /tmp/flutter-analyze.log

      - name: تست‌ها
        timeout-minutes: 6
        run: flutter test --reporter expanded 2>&1 | tee /tmp/flutter-tests.log

      - name: انتشار لاگ تست‌ها
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-tests-log
          path: /tmp/flutter-tests.log
          if-no-files-found: warn
          retention-days: 7

      # رندر صفحه‌ها با فونت و assetهای واقعی برای بازبینی طراحی. خروجی
      # اسکرین‌شات گوشی واقعی نیست و شکست آن بیلد APK را متوقف نمی‌کند.
      - name: اسکرین‌شات‌های رندر‌شده
        if: success()
        continue-on-error: true
        timeout-minutes: 8
        env:
          KARTONIYA_SCREENSHOTS: '1'
        run: flutter test test/screenshot_test.dart --reporter expanded

      - name: انتشار اسکرین‌شات‌های رندر‌شده
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kartoniya-ui-screenshots
          path: build/screenshots
          if-no-files-found: warn
          retention-days: 14

      - name: بیلد release APK (تفکیک ABI)
        if: ${{ github.event.inputs.build_type != 'debug' }}
        run: |
          flutter build apk --release 2>&1 | tee /tmp/flutter-build.log
          flutter build apk --release --split-per-abi 2>&1 | tee -a /tmp/flutter-build.log

      - name: بیلد debug APK
        if: ${{ github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'both' }}
        run: flutter build apk --debug

      - name: انتشار release APKها (Artifact)
        if: ${{ github.event.inputs.build_type != 'debug' }}
        uses: actions/upload-artifact@v4
        with:
          name: kartoniya-release-apks
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: انتشار debug APK (Artifact)
        if: ${{ github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: kartoniya-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: API delivery for restricted clients
        # کلاینت‌های محدود (بدون دسترسی به دامنهٔ blob/artifact) فایل APK را از
        # راه API گیت‌هاب می‌گیرند: blob ساخته می‌شود و SHA آن در check-run
        # «Flutter diagnostics» ثبت می‌شود. برای همهٔ شاخه‌های نشست فعال است.
        if: ${{ (inputs.api_delivery || startsWith(github.ref, 'refs/heads/arena/')) && github.event.inputs.build_type != 'debug' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYTHON'
          import base64, hashlib, json, os, pathlib, subprocess
          exported = []
          # APK جهان‌شمول برای همهٔ دستگاه‌ها و نسخهٔ arm64 برای دانلود سبک‌تر.
          for name in (
              'pubspec.lock',
              'build/app/outputs/flutter-apk/app-release.apk',
              'build/app/outputs/flutter-apk/app-arm64-v8a-release.apk',
              # اسکرین‌شات‌های رندرشدهٔ اسپلش برای بازبینی طراحی در کلاینت‌های
              # محدود؛ اگر مرحلهٔ اسکرین‌شات اجرا نشده باشد، رد می‌شود.
              'build/screenshots/00_studio_ident.png',
              'build/screenshots/01_splash.png',
          ):
              if not pathlib.Path(name).exists():
                  continue
              data = pathlib.Path(name).read_bytes()
              result = subprocess.run(['gh', 'api', '--method', 'POST',
                  'repos/' + os.environ['GITHUB_REPOSITORY'] + '/git/blobs',
                  '--input', '-'], input=json.dumps({
                      'content': base64.b64encode(data).decode(), 'encoding': 'base64',
                  }), text=True, capture_output=True, check=True)
              exported.append({'file': name, 'blob': json.loads(result.stdout)['sha'],
                  'sha256': hashlib.sha256(data).hexdigest(), 'bytes': len(data)})
          pathlib.Path('/tmp/api-delivery.json').write_text(json.dumps(exported, indent=2))
          PYTHON

      - name: Build diagnostics
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYTHON'
          import json, os, pathlib, subprocess
          parts = []
          for name in (
              '/tmp/flutter-format.log', '/tmp/flutter-analyze.log',
              '/tmp/flutter-tests.log', '/tmp/flutter-build.log', '/tmp/api-delivery.json',
          ):
              path = pathlib.Path(name)
              if path.exists():
                  log = path.read_text(errors='replace')
                  parts.append(log if len(log) <= 24000 else log[:12000] + '\n...\n' + log[-12000:])
          payload = {
              'name': 'Flutter diagnostics',
              'head_sha': os.environ['GITHUB_SHA'],
              'status': 'completed',
              'conclusion': 'neutral',
              'output': {
                  'title': 'Flutter test and Android build logs',
                  'summary': 'Captured build diagnostics (test and build steps remain blocking).',
                  'text': '```text\n' + '\n'.join(parts) + '\n```',
              },
          }
          subprocess.run(['gh', 'api', '--method', 'POST',
              'repos/' + os.environ['GITHUB_REPOSITORY'] + '/check-runs',
              '--input', '-'], input=json.dumps(payload), text=True, check=True)
          PYTHON
